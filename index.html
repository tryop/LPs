<!DOCTYPE html> <!-- Define o documento como HTML5 -->
<html lang="pt-br"> <!-- Tag raiz, lang define idioma para SEO -->
<head> <!-- Cabeça do documento, metadados -->
  <meta charset="UTF-8"> <!-- Codificação UTF-8 para acentos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Deixa responsivo no celular -->
  <title>BLUM✨</title> <!-- Título da aba -->
  <meta name="description" content="Criamos landing pages rápidas, bonitas e que convertem. Com a magia da Blum."> <!-- Descrição pro Google -->
  <link rel="icon" type="image/png" href="favicon_Blum.png"> <!-- Ícone da aba -->

  <style> /* Começo do CSS */
    * { /* Seletor universal, pega tudo */
      margin: 0; /* Tira margem externa */
      padding: 0; /* Tira margem interna */
      box-sizing: border-box; /* Padding não aumenta a largura */
    }

    body { /* Corpo da página */
      background: #060007f1; /* Fundo roxo quase preto com transparência */
      font-family: sans-serif; /* Fonte sem serifa */
    }

    .hero { /* Seção principal */
      display: flex; /* Liga flexbox */
      align-items: center; /* Alinha vertical no centro */
      justify-content: space-between; /* Espaça os 3 blocos */
      gap: 40px; /* Espaço entre os blocos */
      padding: 90px; /* Espaço interno */
      background-image: url('dark_mode.jpg'); /* Imagem de fundo */
      background-size: cover; /* Cobre tudo sem distorcer */
      background-position: center; /* Centraliza fundo */
      min-height: 100vh; /* Altura mínima 100% da tela */
    }

    .texto { /* Bloco de texto e botão */
      width: 50%; /* 50% da largura */
    }

    h1 { /* Título principal */
      font-size: 49px; /* Tamanho da letra */
      line-height: 48px; /* Altura entre linhas */
      color: #ffffff; /* Cor branca */
      margin-bottom: 16px; /* Espaço embaixo */
    }

    .texto p { /* Parágrafo dentro de texto */
      font-size: 29px; /* Tamanho da letra */
      color: #e5e5e5; /* Cinza claro */
      margin-bottom: 24px; /* Espaço embaixo */
    }

    button { /* Botão principal */
      background: #5f1c5a; /* Fundo roxo */
      color: #fff; /* Texto branco */
      border-radius: 999px; /* Deixa redondo tipo pílula */
      cursor: pointer; /* Mãozinha no mouse */
      border: none; /* Tira borda padrão */
      padding: 14px 28px; /* Espaço dentro: vertical horizontal */
      font-size: 32px; /* Tamanho da fonte */
      font-weight: 600; /* Negrito médio */
      transition: transform 0.3s ease, box-shadow 0.3s ease; /* Animação suave */
      display: inline-block; /* Permite largura e fica na linha */
    }

    button:hover { /* Quando passa o mouse no botão */
      transform: translateY(-2px) scale(1.02); /* Sobe 2px e cresce 2% */
      box-shadow: 0 10px 20px rgba(167, 139, 250, 0.3); /* Sombra roxa */
    }

    .galeria-vertical { /* Bloco da mascote Blum */
      width: 50%; /* 50% largura */
      display: flex; /* Flexbox */
      flex-direction: column; /* Um embaixo do outro */
      align-items: center; /* Centro horizontal */
      gap: 20px; /* Espaço entre itens */
    }

    .blum-mascote { /* Imagem da Blum */
      width: 380px; /* Largura fixa */
      max-width: 100%; /* Não passa do pai */
      height: auto; /* Altura proporcional */
      object-fit: contain; /* Não corta a imagem */
      filter: drop-shadow(0 20px 30px rgba(167, 139, 250, 0.25)); /* Sombra no contorno */
      animation: flutuar 3s ease-in-out infinite; /* Animação flutuar infinita */
    }

    @keyframes flutuar { /* Cria animação chamada flutuar */
      0%, 100% { transform: translateY(0); } /* Começo e fim no lugar */
      50% { transform: translateY(-10px); } /* Meio sobe 10px */
    }

    .Pages-Flutuantes { /* Container das 3 caixinhas */
      display: flex; /* Flexbox */
      flex-direction: column; /* Coluna */
      align-items: center; /* Centro horizontal */
      gap: 25px; /* Espaço entre caixinhas */
      justify-content: center; /* Centro vertical */
      perspective: 1000px; /* Ativa efeito 3D pro rotateX/Y */
    }

    .Pages-Flutuantes img { /* Imagens dentro das caixinhas */
      width: 100%; /* 100% do pai */
      height: 100%; /* 100% do pai */
      object-fit: cover; /* Preenche cortando excesso */
      display: block; /* Tira espaço fantasma de imagem */
    }

    .page1 { /* Primeira caixinha - confeitos */
      width: 200px; /* Largura */
      height: 200px; /* Altura */
      overflow: hidden; /* Esconde o que passa pra fora */
      border-radius: 30px; /* Borda arredondada */
      border: 3px solid rgba(168, 85, 247, 0.3); /* Borda roxa transparente */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(168, 85, 247, 0.3); /* Sombra preta + brilho roxo */
      transform: translateY(0px) rotateX(5deg) rotateY(-5deg) scale(1.1); /* Inclina 3D e aumenta 10% */
      opacity: 0.9; /* 90% opaca */
      transition: all 0.4s ease; /* Transição suave em tudo */
    }

    .page2 { /* Segunda caixinha - cabelos */
      width: 200px; /* Largura */
      height: 200px; /* Altura */
      overflow: hidden; /* Esconde excesso */
      border-radius: 30px; /* Borda arredondada */
      border: 3px solid rgba(168, 85, 247, 0.3); /* Borda roxa transparente */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(168, 85, 247, 0.3); /* Sombra + brilho */
      transform: translateY(0px) rotateX(5deg) rotateY(-5deg) scale(1.15); /* 3D e 15% maior - destaque */
      opacity: 0.9; /* 90% opaca */
      transition: all 0.4s ease; /* Transição suave */
    }

    .page3 { /* Terceira caixinha - médica */
      width: 200px; /* Largura */
      height: 200px; /* Altura */
      overflow: hidden; /* Esconde excesso */
      border-radius: 30px; /* Borda arredondada */
      border: 3px solid rgba(168, 85, 247, 0.3); /* Borda roxa */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(168, 85, 247, 0.3); /* Sombra + brilho */
      transform: translateY(0px) rotateX(5deg) rotateY(-5deg) scale(1.05); /* 3D e 5% maior */
      opacity: 0.9; /* 90% opaca */
      transition: all 0.4s ease; /* Transição suave */
    }

    .page1:hover, .page2:hover, .page3:hover { /* Hover nas 3 caixinhas */
      transform: translateY(-30px) rotateX(5deg) rotateY(-5deg) scale(1.30); /* Sobe 30px e cresce 30% */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.7); /* Sombra mais forte */
      z-index: 20; /* Traz pra frente de tudo */
      cursor: pointer; /* Mãozinha */
    }

    @media (max-width: 768px) { /* Regra para celular até 768px */
      .hero {
        flex-direction: column; /* Vira coluna no celular */
        padding: 40px 20px; /* Diminui padding */
        text-align: center; /* Centraliza texto */
      }
      .texto, .galeria-vertical { /* Texto e mascote */
        width: 100%; /* Largura total no celular */
      }
      .blum-mascote {
        width: 260px; /* Mascote menor no celular */
        margin-top: 20px; /* Espaço em cima */
      }
      .Pages-Flutuantes {
        flex-direction: row; /* Horizontal embaixo */
        flex-wrap: wrap; /* Se não couber, quebra linha - evita scroll lateral */
        justify-content: center; /* Centraliza as caixinhas */
        gap: 15px; /* Espaço menor no mobile */
        width: 100%; /* Ocupa largura toda */
        margin-top: 30px; /* Espaço da Blum */
      }
      .page1, .page2, .page3 {
        width: 100px; /* Metade no celular */
        height: 100px; /* Metade no celular */
      }
    }
    .github-float { /* Botão GitHub canto esquerdo */
      position: fixed; /* Fixo na tela, não rola */
      bottom: 25px; /* 25px do fundo */
      left: 25px; /* 25px da esquerda */
      width: 55px; /* Largura do círculo */
      height: 55px; /* Altura do círculo */
      background:rgba(0, 0, 0, 0.6); /* Fundo preto 60% transparente */
      backdrop-filter: blur(10px); /* Desfoque de vidro */
      border: 1px solid rgba(255, 255, 255, 0.15); /* Borda branca sutil */
      border-radius: 50%; /* 50% vira círculo */
      display: flex; /* Flexbox pra centralizar ícone */
      align-items: center; /* Centro vertical */
      justify-content: center; /* Centro horizontal */
      color: white; /* Cor do ícone */
      z-index: 100; /* Fica por cima de tudo */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); /* Sombra */
      animation: flutuar-vertical 6s ease-in-out infinite; /* Animação sobe e desce */
    }

    @keyframes flutuar-vertical { /* Animação vertical dos ícones sociais */
      0%, 100% {transform: translateY(0);} /* Começo e fim no lugar */
      50% {transform: translateY(-30px);} /* Meio sobe 30px */
    }

    .github-float:hover { /* Hover GitHub */
      background: white; /* Fundo branco */
      color: black; /* Ícone preto */
      transform: scale(1.4); /* Cresce 40% */
      animation-play-state: paused; /* Pausa flutuação */
    }

    .github-float svg { /* SVG dentro do GitHub */
      width: 28px; /* Largura ícone */
      height: 28px; /* Altura ícone */
      fill: currentColor; /* Pega a cor do pai */
    }

    .instagram-float { /* Botão Instagram canto direito */
      position: fixed; /* Fixo na tela */
      bottom: 25px; /* 25px do fundo */
      right: 25px; /* 25px da direita */
      width: 55px; /* Largura círculo */
      height: 55px; /* Altura círculo */
      background:rgba(0, 0, 0, 0.6); /* Fundo preto transparente */
      backdrop-filter: blur(10px); /* Efeito vidro */
      border: 1px solid rgba(255, 255, 255, 0.15); /* Borda sutil */
      border-radius: 50%; /* Círculo */
      display: flex; /* Flexbox */
      align-items: center; /* Centro vertical */
      justify-content: center; /* Centro horizontal */
      color: white; /* Cor ícone */
      z-index: 100; /* Por cima */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); /* Sombra */
      animation: flutuar-vertical 6s ease-in-out infinite; /* Mesma animação do GitHub */
      animation-delay: 0.8s; /* Atrasa 0.8s pra não flutuarem juntos */
    }

    .instagram-float:hover { /* Hover Instagram */
      background: white; /* Fundo branco */
      color:black; /* Ícone preto */
      transform: scale(1.4); /* Cresce 40% */
      animation-play-state: paused; /* Pausa animação */
    }

    .instagram-float svg { /* SVG Instagram */
      width: 28px; /* Largura */
      height: 28px; /* Altura */
      fill: currentColor; /* Cor do pai */
    }
  </style> <!-- Fecha CSS -->
</head> <!-- Fecha head -->

<body> <!-- Começo do visível -->

    <div class="texto"> <!-- Bloco texto -->
      <h1>Criamos Landing Pages para o seu negócio!</h1> <!-- Título -->
      <p>Página rápida, bonita e no seu estilo com a magia da Blum!</p> <!-- Subtítulo -->

    <div class="galeria-vertical"> <!-- Bloco mascote -->
      <img src="blum_transparent.png" class="blum-mascote" alt="Blum mascote"> <!-- Imagem da Blum -->

      <div class="page3"> <!-- Caixa 3 -->
        <img src="blum_médica.jpg" alt="Blum-médica"> <!-- Imagem clínica -->
      </div> <!-- Fecha page3 -->
  </div> <!-- Fecha Pages-Flutuantes -->
</section> <!-- Fecha hero -->
